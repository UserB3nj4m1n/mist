<div class="mainDiv">
  <div class="container">
    <h2 class="LoginText">Register</h2>
    <form action="">
      <div class="form-group">
        <input
          type="text"
          class="form-control"
          id="displayName"
          placeholder="Enter nickname"
          name="displayName"
          [(ngModel)]="displayName"
        />
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter email"
          name="email"
          [(ngModel)]="email"
        />

        <input
          type="password"
          class="form-control"
          id="pwd"
          placeholder="Enter password"
          name="pswd"
          [(ngModel)]="password"
        />

        <input
          type="password"
          class="form-control"
          id="conpswd"
          placeholder="Confirm password"
          name="conpswd"
          [(ngModel)]="confirmPassword"
        />

        <div class="ForgotPassDiv">
          <p class="ForgotPass"></p>
          <p class="Register">
            <a routerLink="/login" class="LinksRegPass" style="color: #6e8396"
              >Login</a
            >
          </p>
        </div>
        <button type="login" class="loginButton" (click)="register()">
          Register
        </button>
      </div>
    </form>
  </div>
</div>

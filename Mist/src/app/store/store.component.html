<div class="main">
  <div class="filter">
    <p style="font-size: 16px; font-weight: 600">Game Filters</p>
    <div class="filterLine">
      <p class="filterMainText">Search</p>
      <input type="search" placeholder="Search" name="" id="" />
    </div>
    <div class="filterLine">
      <p class="filterMainText">Prize</p>
      <input type="range" name="Prize" id="Prize" />
    </div>
    <div class="filterLine">
      <p class="filterMainText">Rating</p>
      <input type="checkbox" name="5star" id="5star" /><label for="3star"
        >⭐⭐⭐⭐⭐</label
      >
      <br />
      <input type="checkbox" name="4star" id="4star" /><label for="3star"
        >⭐⭐⭐⭐</label
      >
      <br />
      <input type="checkbox" name="3star" id="3star" /><label for="3star"
        >⭐⭐⭐</label
      >
      <br />
      <input type="checkbox" name="2star" id="2star" /><label for="2star"
        >⭐⭐</label
      >
      <br />
      <input type="checkbox" name="1star" id="1star" /><label for="1star"
        >⭐</label
      >
    </div>
    <div class="filterLine category-container">
      <p class="filterMainText">Categories</p>
      <select name="category" id="category">
        <option value="">Select category</option>
        <option value="Action">Action</option>
        <option value="Adventure">Adventure</option>
        <option value="Action & Shooting">Action & Shooting</option>
        <option value="Indie">Indie</option>
        <option value="RPG">RPG</option>
        <option value="Simulator">Simulator</option>
        <option value="Strategy">Strategy</option>
        <option value="MMO">MMO</option>
        <option value="Casual">Casual</option>
        <option value="Sports">Sports</option>
        <option value="Racing">Racing</option>
        <option value="Horror">Horror</option>
        <option value="Economy">Economy</option>
        <option value="Arcade">Arcade</option>
        <option value="Fighting">Fighting</option>
        <option value="Stealth">Stealth</option>
        <option value="Puzzle">Puzzle</option>
        <option value="Kids & Family">Kids & Family</option>
        <option value="Dance & Music">Dance & Music</option>
        <option value="Romance">Romance</option>
        <option value="Sandbox">Sandbox</option>
        <option value="Battle Royale">Battle Royale</option>
        <option value="Fantasy">Fantasy</option>
        <option value="VR">VR</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="filterLine year-container">
      <p class="filterMainText">Year of release</p>
      <select name="year" id="year">
        <option value="">Select year</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
        <option value="2014">2014</option>
        <option value="2013">2013</option>
        <option value="2012">2012</option>
        <option value="2011">2011</option>
        <option value="2010">2010</option>
        <option value="2009">2009</option>
        <option value="2008">2008</option>
        <option value="2007">2007</option>
        <option value="2006">2006</option>
        <option value="2005">2005</option>
        <option value="2004">2004</option>
        <option value="2003">2003</option>
        <option value="2002">2002</option>
        <option value="2001">2001</option>
        <option value="2000">2000</option>
      </select>
    </div>
    <div class="filterLine">
      <p class="filterMainText">Operating system</p>
      <input type="checkbox" name="Windows" id="Windows" /><label for="Windows"
        >Windows</label
      >
      <br />
      <input type="checkbox" name="Linux" id="Linux" /><label for="Linux"
        >Linux</label
      >
      <br />
      <input type="checkbox" name="Mac" id="Mac" /><label for="Mac">Mac</label>
    </div>
  </div>

  <div class="game-list">
    <div class="sort-by-container">
      <p>Sort by:</p>
      <select name="sortBy">
        <option value="default">Default</option>
        <option value="priceLowHigh">Price: Low to High</option>
        <option value="priceHighLow">Price: High to Low</option>
        <option value="ratingHighLow">Rating: High to Low</option>
        <option value="yearNewest">Release Year: Newest First</option>
        <option value="yearOldest">Release Year: Oldest First</option>
      </select>

      <div class="ViewLayaut">
        <button
          class="ButtonsView"
          (click)="toggleView('grid')"
          [class.active]="isGridView"
        >
          <div class="ViewLayautCategory">
            <mat-icon>grid_on</mat-icon>
            <div>Grid</div>
          </div>
        </button>
        <button
          class="ButtonsView"
          (click)="toggleView('list')"
          [class.active]="!isGridView"
        >
          <div class="ViewLayautCategory">
            <mat-icon>view_headline</mat-icon>
            <div>Lines</div>
          </div>
        </button>
      </div>
    </div>

    <div [ngClass]="{ 'grid-view': isGridView, 'list-view': !isGridView }">
      <app-store-card *ngFor="let game of games$ | async" [game]="game">
      </app-store-card>
    </div>
  </div>
</div>

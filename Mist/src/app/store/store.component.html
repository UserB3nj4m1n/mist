<div class="main">
  <div class="filter">
    <p>Game Filters</p>
    <div class="filterLine">
      <p class="filterMainText">Search</p>
      <input type="search" placeholder="Search" name="" id="" />
    </div>
    <div class="filterLine">
      <p class="filterMainText">Prize</p>
      <input type="range" name="Prize" id="Prize" />
    </div>
    <div class="filterLine">
      <p class="filterMainText">Rating</p>
      <input type="checkbox" name="5star" id="5star" /><label for="3star"
        >⭐⭐⭐⭐⭐</label
      >
      <br />
      <input type="checkbox" name="4star" id="4star" /><label for="3star"
        >⭐⭐⭐⭐</label
      >
      <br />
      <input type="checkbox" name="3star" id="3star" /><label for="3star"
        >⭐⭐⭐</label
      >
      <br />
      <input type="checkbox" name="2star" id="2star" /><label for="2star"
        >⭐⭐</label
      >
      <br />
      <input type="checkbox" name="1star" id="1star" /><label for="1star"
        >⭐</label
      >
    </div>
    <div class="filterLine">
      <p class="filterMainText">Categories</p>
      <input list="categories" name="category" placeholder="Select category" />
      <datalist id="categories">
        <option value="Action"></option>
        <option value="Adventure"></option>
        <option value="Action & Shooting"></option>
        <option value="Indie"></option>
        <option value="RPG"></option>
        <option value="Simulator"></option>
        <option value="Strategy"></option>
        <option value="MMO"></option>
        <option value="Casual"></option>
        <option value="Sports"></option>
        <option value="Racing"></option>
        <option value="Horror"></option>
        <option value="Economy"></option>
        <option value="Arcade"></option>
        <option value="Fighting"></option>
        <option value="Stealth"></option>
        <option value="Puzzle"></option>
        <option value="Kids & Family"></option>
        <option value="Dance & Music"></option>
        <option value="Romance"></option>
        <option value="Sandbox"></option>
        <option value="Battle Royale"></option>
        <option value="Fantasy"></option>
        <option value="VR"></option>
        <option value="Other"></option>
      </datalist>
    </div>
    <div class="filterLine">
      <p class="filterMainText">Year of release</p>
      <input list="year" name="year" placeholder="Select year" />
      <datalist id="year">
        <option value="2026"></option>
        <option value="2025"></option>
        <option value="2024"></option>
        <option value="2023"></option>
        <option value="2022"></option>
        <option value="2021"></option>
        <option value="2020"></option>
        <option value="2019"></option>
        <option value="2018"></option>
        <option value="2017"></option>
        <option value="2016"></option>
        <option value="2015"></option>
        <option value="2014"></option>
        <option value="2013"></option>
        <option value="2012"></option>
        <option value="2011"></option>
        <option value="2010"></option>
        <option value="2009"></option>
        <option value="2008"></option>
        <option value="2007"></option>
        <option value="2006"></option>
        <option value="2005"></option>
        <option value="2004"></option>
        <option value="2003"></option>
        <option value="2002"></option>
        <option value="2001"></option>
        <option value="2000"></option>
      </datalist>
    </div>
    <div class="filterLine">
      <p class="filterMainText">Operating system</p>
      <input type="checkbox" name="Windows" id="Windows" /><label for="Windows"
        >Windows</label
      >
      <br />
      <input type="checkbox" name="Linux" id="Linux" /><label for="Linux"
        >Linux</label
      >
      <br />
      <input type="checkbox" name="Mac" id="Mac" /><label for="Mac">Mac</label>
    </div>
  </div>
  <div class="game-list">
    <app-store-card *ngFor="let game of games" [game]="game"></app-store-card>
  </div>
</div>

<div *ngIf="isAuthenticated; else notAuthenticated">
  <div class="main">
    <div class="filter">
      <p class="filter-title">Game Filters</p>
      <div class="filterLine">
        <p class="filterMainText">Search</p>
        <input
          type="search"
          class="form-control"
          id="Search"
          placeholder="Search"
          name="Search"
          [(ngModel)]="searchQuery"
          (input)="applyFilters()"
        />
      </div>
      <div class="filterLine">
        <p class="filterMainText">Price</p>
        <p class="filterMainText">1 - 200 | {{ selPrice }} and less</p>
        <input
          type="range"
          name="Price"
          id="Price"
          min="1"
          max="200"
          [(ngModel)]="selPrice"
          (change)="applyFilters()"
        />
      </div>
      <div class="filterLine">
        <p class="filterMainText">Rating</p>
        <input
          type="checkbox"
          id="5star"
          (change)="toggleRating(5)"
        /><label for="5star">⭐⭐⭐⭐⭐ ({{ ratingCounts[5] || 0 }})</label><br />
        <input
          type="checkbox"
          id="4star"
          (change)="toggleRating(4)"
        /><label for="4star">⭐⭐⭐⭐ ({{ ratingCounts[4] || 0 }})</label><br />
        <input
          type="checkbox"
          id="3star"
          (change)="toggleRating(3)"
        /><label for="3star">⭐⭐⭐ ({{ ratingCounts[3] || 0 }})</label><br />
        <input
          type="checkbox"
          id="2star"
          (change)="toggleRating(2)"
        /><label for="2star">⭐⭐ ({{ ratingCounts[2] || 0 }})</label><br />
        <input
          type="checkbox"
          id="1star"
          (change)="toggleRating(1)"
        /><label for="1star">⭐ ({{ ratingCounts[1] || 0 }})</label>
      </div>
      <div class="filterLine category-container">
        <p class="filterMainText">Categories</p>
        <div *ngFor="let genre of genres">
          <input
            type="checkbox"
            [id]="genre.name"
            (change)="toggleCategory(genre.name)"
          />
          <label [for]="genre.name">
            {{ genre.name }} ({{ genre.count }})
          </label><br />
        </div>
      </div>
      <div class="filterLine">
        <p class="filterMainText">Platforms</p>
        <input
          type="checkbox"
          id="Windows"
          (change)="togglePlatform('Windows')"
        /><label for="Windows">Windows ({{ platformCounts['Windows'] || 0 }})</label><br />
        <input
          type="checkbox"
          id="Linux"
          (change)="togglePlatform('Linux')"
        /><label for="Linux">Linux ({{ platformCounts['Linux'] || 0 }})</label><br />
        <input
          type="checkbox"
          id="Mac"
          (change)="togglePlatform('Mac')"
        /><label for="Mac">Mac ({{ platformCounts['Mac'] || 0 }})</label>
      </div>
    </div>

    <div class="game-list">
      <div class="sort-by-container">
        <p>Sort by:</p>
        <select name="sortBy" [(ngModel)]="sortBy" (change)="onSortChange()">
          <option value="default">Default</option>
          <option value="priceLowHigh">Price: Low to High</option>
          <option value="priceHighLow">Price: High to Low</option>
          <option value="ratingHighLow">Rating: High to Low</option>
        </select>

        <div class="ViewLayaut">
          <button
            class="ButtonsView"
            (click)="toggleView('grid')"
            [class.active]="isGridView"
          >
            <div class="ViewLayautCategory">
              <mat-icon>grid_on</mat-icon>
              <div>Grid</div>
            </div>
          </button>
          <button
            class="ButtonsView"
            (click)="toggleView('list')"
            [class.active]="!isGridView"
          >
            <div class="ViewLayautCategory">
              <mat-icon>view_headline</mat-icon>
              <div>Lines</div>
            </div>
          </button>
        </div>
      </div>

      <div [ngClass]="{ 'grid-view': isGridView, 'list-view': !isGridView }">
        <app-store-card
          *ngFor="let game of paginatedGames"
          [game]="game"
        ></app-store-card>
      </div>

      <div class="pagination">
        <button
          class="NextPrevPage"
          (click)="prevPage()"
          [disabled]="currentPage === 1"
        >
          <<< </button>
        <span>Page {{ currentPage }} of {{ totalPages }}</span>
        <button
          class="NextPrevPage"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
        >
          >>>
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #notAuthenticated>
  <div class="notAuthenticated">
    <p class="MustLog">You must be logged in to access this page.</p>
  </div>
</ng-template>

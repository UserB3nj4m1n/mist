<div class="game-card">
  <img [src]="game.background_image" alt="{{ game.name }}" class="game-image" />
  <div class="game-info">
    <h3 class="game-title">{{ game.name }}</h3>
    <p class="game-category">
      <span *ngFor="let genre of game.genres; let i = index">
        {{ genre.name }}<span *ngIf="i < game.genres.length - 1">, </span>
      </span>
    </p>
    <p class="game-release">Release Date: {{ game.released }}</p>
  </div>
  <div class="game-price">
    <div class="discounted-price">
      ${{ game.originalPrice }}
    </div>
    <div *ngIf="game.discount > 0" class="original-price">
      ${{ game.discountedPrice }}
    </div>
    <div *ngIf="game.discount > 0" class="game-discount">
      -{{ game.discount }}%
    </div>
    <button class="buy-now">Buy Now</button>
  </div>
</div>

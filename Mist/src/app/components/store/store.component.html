<div *ngIf="isAuthenticated; else notAuthenticated">
  <div class="main">
    <div class="FilterMainDiv">
      <p-accordion value="0" [multiple]="true">
        <p-accordion-panel value="0">
          <p-accordion-header>Search</p-accordion-header>
          <p-accordion-content>
            <p-iconfield>
              <div>
                <p-inputicon class="fa-solid fa-magnifying-glass" />
                <input
                  type="text"
                  pInputText
                  placeholder="Search"
                  [style]="{ width: '100%  ' }"
                  [(ngModel)]="searchQuery"
                  (input)="applyFilters()"
                />
              </div>
            </p-iconfield>
          </p-accordion-content>
        </p-accordion-panel>
        <p-accordion-panel value="1">
          <p-accordion-header>Price</p-accordion-header>
          <p-accordion-content>
            <p-slider [(ngModel)]="rangeValues" class="w-56" />
            <div class="prizeRangeText">
              <p-inputnumber
                inputId="rangeValues"
                [style]="{ width: '100%' }"
                [(ngModel)]="rangeValues"
              />
            </div>
          </p-accordion-content>
        </p-accordion-panel>

        <p-accordion-panel value="2">
          <p-accordion-header>Categories</p-accordion-header>
          <p-accordion-content>
            <div *ngFor="let genre of genres" class="CategoriesDiv">
              <p-checkbox
                [inputId]="genre.name"
                name="group"
                [value]="genre.name"
                [(ngModel)]="selectedCategories"
                (ngModelChange)="onCategoryChange(genre.name)"
                styleClass="genre-checkbox"
              />
              <label [for]="genre.name" style="padding-left: 10px">
                {{ truncate(genre.name, 14) }}
              </label>
              <div class="genreTag">
                <p-tag severity="secondary" value="{{ genre.value }}" />
              </div>
            </div>
          </p-accordion-content>
        </p-accordion-panel>

        <p-accordion-panel value="3">
          <p-accordion-header>Rating</p-accordion-header>
          <p-accordion-content
            ><div *ngFor="let rating of ratings" class="CategoriesDiv">
              <p-checkbox
                [inputId]="'rating-' + rating.rating"
                name="ratings"
                [value]="rating.rating"
                [(ngModel)]="selectedRatings"
                (ngModelChange)="onRatingChange(rating.rating)"
                styleClass="genre-checkbox"
              ></p-checkbox>
              <p-rating
                [(ngModel)]="rating.rating"
                [readonly]="true"
                style="padding-left: 10px"
              />
              <label
                [for]="'rating-' + rating.rating"
                style="padding-left: 10px; vertical-align: middle"
              >
                {{ rating.rating }}
              </label>

              <div class="genreTag">
                <p-tag severity="secondary" value="{{ rating.count }}"></p-tag>
              </div>
            </div>
          </p-accordion-content>
        </p-accordion-panel>
        <p-accordion-panel value="4">
          <p-accordion-header>Platforms</p-accordion-header>
          <p-accordion-content>
            <div *ngFor="let platform of platforms" class="CategoriesDiv">
              <p-checkbox
                [inputId]="'platform-' + platform.abbreviation"
                name="platforms"
                [value]="platform.abbreviation"
                [(ngModel)]="selectedPlatforms"
                (ngModelChange)="onPlatformChange(platform.abbreviation)"
                styleClass="genre-checkbox"
              ></p-checkbox>

              <label
                [for]="'platform-' + platform.abbreviation"
                style="padding-left: 10px"
              >
                {{ platform.abbreviation }}
              </label>

              <div class="genreTag">
                <p-tag
                  severity="secondary"
                  value="{{ platform.count }}"
                ></p-tag>
              </div>
            </div>
          </p-accordion-content>
        </p-accordion-panel>
      </p-accordion>
    </div>

    <div *ngIf="loading" class="loader-container">
      <div class="loader"></div>
      <p>Loading games...</p>
    </div>
    <div class="game-list" *ngIf="!loading">
      <div class="sort-by-container">
        <p>Sort by:</p>
        <select
          class="sortBy"
          name="sortBy"
          [(ngModel)]="sortBy"
          (change)="onSortChange()"
        >
          <option value="default">Default</option>
          <option value="priceLowHigh">Price: Low to High</option>
          <option value="priceHighLow">Price: High to Low</option>
          <option value="ratingLowHigh">Rating: Low to High</option>
          <option value="ratingHighLow">Rating: High to Low</option>
        </select>

        <div class="ViewLayaut">
          <button
            class="ButtonsView"
            (click)="toggleView('grid')"
            [class.active]="isGridView"
          >
            <div class="ViewLayautCategory">
              <mat-icon>grid_on</mat-icon>
              <div>Grid</div>
            </div>
          </button>
          <button
            class="ButtonsView"
            (click)="toggleView('list')"
            [class.active]="!isGridView"
          >
            <div class="ViewLayautCategory">
              <mat-icon>view_headline</mat-icon>
              <div>Lines</div>
            </div>
          </button>
        </div>
      </div>

      <div [ngClass]="{ 'grid-view': isGridView, 'list-view': !isGridView }">
        <app-store-card
          *ngFor="let game of paginatedGames"
          [game]="game"
          [viewMode]="isGridView ? 'grid' : 'lines'"
        ></app-store-card>
      </div>

      <div class="pagination">
        <button
          class="NextPrevPage"
          (click)="prevPage()"
          [disabled]="currentPage === 1"
        >
          <
        </button>
        <span>Page {{ currentPage }} of {{ totalPages }}</span>
        <button
          class="NextPrevPage"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
        >
          >
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #notAuthenticated>
  <div class="notAuthenticated">
    <p class="MustLog">You must be logged in to access this page.</p>
  </div>
</ng-template>

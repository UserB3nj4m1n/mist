<div class="cart-container">
  <h2>Your Cart</h2>

  <div *ngIf="cartItems.length === 0" class="empty-cart-message">
    <p>Your cart is empty.</p>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-items-list">
    <div *ngFor="let item of cartItems" class="cart-item">
      <div class="item-details">
        <img [src]="item.game.image" alt="{{ item.game.title }}" class="item-image">
        <div class="item-info">
          <h3>{{ item.game.title }}</h3>
          <p>Quantity: {{ item.quantity }}</p>
          <p>Price: ${{ item.price | number:'1.2-2' }}</p>
        </div>
      </div>
    </div>

    <div class="cart-summary">
      <h3>Total: ${{ getTotal() | number:'1.2-2' }}</h3>
      <button (click)="checkout()" class="checkout-button">Proceed to Checkout</button>
    </div>
  </div>
</div>

<p-card *ngIf="userProfile">
  <div class="MainBox">
    <div>
      <p class="MainText">Profile information</p>
      <p class="smalText">Manage your account information and settings here.</p>
    </div>
    <div class="ContentBox">
      <div class="ProfilePic">
        <img
          [src]="userProfile.photoURL || '/ProfilPic.png'"
          class="ProfileImage"
        />
        <p-button
          icon="fa-solid fa-camera"
          label="Change Picture"
          *ngIf="!showInput"
          (click)="toggleInput()"
        />
        <div
          *ngIf="showInput"
          class="InfoLine"
          style="margin-top: 10px; width: 100%"
        >
          <p-inputgroup>
            <p-inputgroup-addon>www</p-inputgroup-addon>
            <p-floatlabel>
              <input
                pInputText
                id="Profile Picture URL"
                [(ngModel)]="userProfile.photoURL"
              />
              <label for="Profile Picture URL">Profile Picture URL</label>
            </p-floatlabel>
          </p-inputgroup>
        </div>
      </div>

      <div class="InfoBox">
        <div>
          <p-floatlabel>
            <input
              pInputText
              id="First Name"
              [(ngModel)]="userProfile.realname"
              autocomplete="off"
              fluid
            />
            <label for="First Name">First Name</label>
          </p-floatlabel>
        </div>
        <div>
          <p-floatlabel>
            <input
              pInputText
              id="Last Name"
              [(ngModel)]="userProfile.realsurname"
              autocomplete="off"
              fluid
            />
            <label for="Last Name">Last Name</label>
          </p-floatlabel>
        </div>
      </div>
      <div class="InfoLine">
        <div class="Input-Div">
          <p-floatlabel>
            <input
              pInputText
              id="Profile Name"
              [(ngModel)]="userProfile.displayName"
              autocomplete="off"
              fluid
            />
            <label for="Profile Name">Profile Name</label>
          </p-floatlabel>
        </div>
      </div>
      <div class="InfoLine">
        <div class="Input-Div">
          <p-floatlabel>
            <input
              pInputText
              id="Email Address"
              [value]="userProfile.email"
              autocomplete="off"
              fluid
              disabled
              placeholder="example.email.com"
            />
            <label for="Email Address">Email Address</label>
          </p-floatlabel>
        </div>
      </div>
      <div class="InfoLine">
        <div class="Input-Div">
          <p-floatlabel>
            <p-inputmask
              id="Phone Number"
              [(ngModel)]="userProfile.phone"
              mask="+999-999-999-999"
              fluid="true"
            />
            <label for="Phone Number">Phone Number</label>
          </p-floatlabel>
        </div>
      </div>
      <div class="InfoLine">
        <div class="Input-Div">
          <p-floatlabel>
            <textarea
              pTextarea
              id="Bio"
              [(ngModel)]="userProfile.bio"
              rows="5"
              cols="30"
              style="resize: none"
              class="h-full"
              fluid
            ></textarea>
            <label for="Bio">Bio</label>
          </p-floatlabel>
        </div>
      </div>
      <div class="ButtonBox">
        <p-button
          label="Save Changes"
          severity="success"
          (click)="saveProfile()"
        />
        <p-button label="Cancel" severity="danger" (click)="cancelProfile()" />
      </div>
    </div>
  </div>
</p-card>

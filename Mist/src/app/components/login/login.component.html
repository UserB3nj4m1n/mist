<div class="mainDiv">
  <div class="container">
    <h2 class="LoginText">Login</h2>
    <form action="">
      <div class="form-group">
        <input
          class="form-control"
          id="nickname"
          placeholder="Enter email"
          type="email"
          name="email"
          [(ngModel)]="email"
        />

        <input
          type="password"
          class="form-control"
          id="pwd"
          placeholder="Enter password"
          name="password"
          [(ngModel)]="password"
        />
        <div class="ForgotPassDiv">
          <p class="ForgotPass">
            <a class="LinksRegPass">Forgot password</a>
          </p>
          <p class="Register">
            <a
              routerLink="/register"
              class="LinksRegPass"
              style="color: #6e8396"
              >Register</a
            >
          </p>
        </div>
        <button type="login" class="loginButton" (click)="login()">
          Login
        </button>
      </div>
    </form>
  </div>
</div>

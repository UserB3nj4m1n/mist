<div class="container">
  <div class="register-card-div">
    <p-card header="Register"
      ><div class="inputs-div">
        <p-floatlabel variant="on">
          <p-iconfield>
            <p-inputicon class="fa fa-user" />
            <input
              pInputText
              id="over_label"
              [(ngModel)]="displayName"
              autocomplete="off"
            />
          </p-iconfield>
          <label for="over_label">Enter nickname</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-iconfield>
            <p-inputicon class="fa fa-envelope" />
            <input
              pInputText
              id="over_label"
              [(ngModel)]="email"
              autocomplete="off"
            />
          </p-iconfield>
          <label for="over_label">Enter email</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-iconfield>
            <p-inputicon class="fa fa-lock" />
            <input
              type="password"
              pInputText
              id="over_label"
              [(ngModel)]="password"
              autocomplete="off"
            />
          </p-iconfield>
          <label for="over_label">Enter password</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-iconfield>
            <p-inputicon class="fa fa-lock" />
            <input
              type="password"
              pInputText
              id="over_label"
              [(ngModel)]="confirmPassword"
              autocomplete="off"
            />
          </p-iconfield>
          <label for="over_label">Confirm password</label>
        </p-floatlabel>
      </div>
      <div class="ForgotPassDiv">
        <p class="ForgotPass"></p>
        <p class="Register">
          <a
            routerLink="/login"
            class="LinksRegPass"
            style="color: var(--p-primary-500)"
            >Login</a
          >
        </p>
      </div>
      <div class="login-button-div">
        <p-toast />
        <p-button
          styleClass="login-button"
          label="Register"
          (click)="register()"
        />
      </div>
    </p-card>
  </div>
</div>

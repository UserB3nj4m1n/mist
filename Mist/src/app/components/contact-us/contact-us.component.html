<div class="contact-us-container">
  <p class="contact-us-title">Contact Us</p>
  <div class="contact-us-form">
    <form action="" class="contact-form">
      <input class="inputName" type="text" placeholder="Your Name" required />
      <input class="inputName" type="email" placeholder="Your Email" required />
      <textarea
        class="inputName"
        style="height: 300px"
        placeholder="Your Message"
        required
      ></textarea>
      <button class="loginBut" type="submit">Send Message</button>
    </form>
  </div>
</div>

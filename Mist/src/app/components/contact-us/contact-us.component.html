<div class="contact-us-container">
  <p class="contact-us-title">Contact Us</p>
  <div class="contact-us-form">
    <form
      [formGroup]="contactForm"
      (ngSubmit)="onSubmit()"
      class="contact-form"
    >
      <div class="inputNameContainer">
        <input
          class="inputName"
          type="text"
          formControlName="name"
          placeholder="Your Name"
          required
        />
        <input
          class="inputName"
          type="text"
          formControlName="surname"
          placeholder="Your Surname"
          required
        />
      </div>
      <div>
        <input
          class="inputName"
          type="email"
          formControlName="email"
          placeholder="Your Email"
          required
        />
      </div>
      <textarea
        class="inputName"
        formControlName="message"
        style="height: 300px; padding-top: 10px; max-width: 350px"
        placeholder="Your Message"
        required
      ></textarea>

      <button class="loginBut" type="submit" [disabled]="!contactForm.valid">
        Send Message
      </button>
    </form>
  </div>
</div>

<div class="checkout-container">
  <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
    <p-card header="Account Details">
      <div class="p-fluid">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" pInputText formControlName="email">
        </div>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" pInputText formControlName="name">
        </div>
        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" pInputText formControlName="lastName">
        </div>
      </div>
    </p-card>

    <p-card header="Address">
      <div class="p-fluid">
        <div class="field">
          <label for="postCode">Post Code</label>
          <input id="postCode" type="text" pInputText formControlName="postCode">
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input id="address" type="text" pInputText formControlName="address">
        </div>
        <div class="field">
          <label for="city">City</label>
          <input id="city" type="text" pInputText formControlName="city">
        </div>
        <div class="field">
          <label for="country">Country</label>
          <input id="country" type="text" pInputText formControlName="country">
        </div>
      </div>
    </p-card>

    <p-card header="Billing Details">
      <div class="p-fluid">
        <div class="field">
          <label for="cardNumber">Card Number</label>
          <input id="cardNumber" type="text" pInputText formControlName="cardNumber">
        </div>
        <div class="field">
          <label for="expirationDate">Expiration Date (MM/YY)</label>
          <input id="expirationDate" type="text" pInputText formControlName="expirationDate">
        </div>
        <div class="field">
          <label for="cvv">CVV</label>
          <input id="cvv" type="text" pInputText formControlName="cvv">
        </div>
      </div>
    </p-card>

    <div class="mt-4">
      <p-button label="Submit" type="submit" [disabled]="!checkoutForm.valid"></p-button>
    </div>
  </form>
</div>

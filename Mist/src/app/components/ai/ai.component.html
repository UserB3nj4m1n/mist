<div class="chat-Icon" (click)="toggleChat()" *ngIf="!showChat">
  <p-button
    icon="fa-regular fa-message"
    [rounded]="true"
    [style]="{
      'font-size': '25px',
      height: '60px',
      width: '60px'
    }"
  />
</div>
<div class="ollama-demo" *ngIf="showChat">
  <p-card>
    <div class="text-header">
      <div class="header-left">
        <span
          class="material-symbols-outlined botIcon"
          style="background-color: var(--p-button-primary-background)"
        >
          robot_2
        </span>
        <p class="title">Mist AI</p>
      </div>
      <p-button
        icon="fa-solid fa-xmark"
        [rounded]="true"
        [text]="true"
        severity="danger"
        (click)="toggleChat()"
      />
    </div>
    <p-divider styleClass="midrow" />
    <div class="chat-body">
      <div class="chat-window">
        <div *ngFor="let msg of messages" class="msg" [ngClass]="msg.sender">
          <span *ngIf="msg.sender === 'user'" class="label"
            >{{ userProfile?.displayName }}:</span
          >
          <span *ngIf="msg.sender === 'ai'" class="label">AI:</span>
          <span>{{ msg.text }}</span>
        </div>
        <div *ngIf="loading">...</div>
        <div *ngIf="error" class="error">{{ error }}</div>
      </div>
      <div class="inputArea">
        <input type="text" pInputText [(ngModel)]="prompt" [fluid]="true" />
        <p-button
          icon="fa-regular fa-paper-plane"
          (click)="generate()"
          [disabled]="loading"
        />
      </div>
    </div>
  </p-card>
</div>

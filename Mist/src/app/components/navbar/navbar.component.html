<ng-container *ngIf="authStatusResolved">
  <p-menubar [model]="items" class="custom-menubar" ngSkipHydration>
    <ng-template pTemplate="start">
      <img
        src="LogoMist.jpg"
        alt="logo"
        class="logo-img"
        style="cursor: pointer"
        (click)="goWelcome()"
      />
    </ng-template>

    <ng-template pTemplate="end">
      <ng-container *ngIf="!isAuthenticated; else authenticated">
        <p-button
          label="Login / Register"
          (onClick)="goRegister()"
          class="marginright"
        ></p-button>
      </ng-container>

      <ng-template #authenticated>
        <p-button
          icon="fa-regular fa-user"
          label="Profile"
          (onClick)="goProfile()"
          class="marginright"
        ></p-button>

        <p-button icon="fas fa-sign-out-alt" (onClick)="logout()"></p-button>
      </ng-template>
    </ng-template>
  </p-menubar>
</ng-container>

<div class="game-card">
  <img [src]="game.cover.url" alt="{{ game.name }}" class="game-image" />
  <div class="game-info">
    <h3 class="game-title">
      <ng-container *ngIf="viewMode === 'grid'; else fullTitle">
        {{ game.name | slice : 0 : 25
        }}<span *ngIf="game.name.length > 25">...</span>
      </ng-container>
      <ng-template #fullTitle>
        {{ game.name }}
      </ng-template>
    </h3>
    <p class="game-category">
      <span *ngFor="let genre of game.genres; let i = index">
        {{ genre.name }}<span *ngIf="i < game.genres.length - 1">, </span>
      </span>
    </p>
    <p class="game-release">Release Date: {{ game.release_dates[0].human }}</p>
  </div>
  <div class="game-price">
    <div class="discounted-price">
      <p class="discounted-price-text">{{ game.discountedPrice }}€</p>
    </div>
    <div *ngIf="game.discount > 0" class="original-price">
      {{ game.originalPrice }}€
    </div>
    <div *ngIf="game.discount > 0" class="game-discount">
      -{{ game.discount }}%
    </div>
    <button class="buy-now" [routerLink]="['/game', game.id]">Buy Now</button>
  </div>
</div>

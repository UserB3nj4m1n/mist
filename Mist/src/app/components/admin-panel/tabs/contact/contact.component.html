<div class="filter">
  <p-selectbutton
    [options]="sizes"
    [(ngModel)]="selectedSize"
    [multiple]="false"
    optionLabel="name"
    optionValue="value"
  />
  <p-iconfield>
    <p-inputicon class="fa-solid fa-magnifying-glass" />
    <input type="text" pInputText placeholder="Search" />
  </p-iconfield>
</div>
<p-table
  *ngIf="contacts.length; else loading"
  [value]="contacts"
  [tableStyle]="{ 'min-width': '60rem' }"
  [size]="selectedSize"
  [paginator]="true"
  [rows]="20"
  [rowsPerPageOptions]="[5, 10, 20, 50]"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Date</th>
      <th>Name</th>
      <th>Surname</th>
      <th>Email</th>
      <th>Message</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-contact>
    <tr>
      <td>
        {{
          contact.date?.toDate
            ? (contact.date.toDate() | date : "short")
            : contact.date
        }}
      </td>
      <td>{{ contact.name }}</td>
      <td>{{ contact.surname }}</td>
      <td>{{ contact.email }}</td>
      <td>{{ contact.message }}</td>
    </tr>
  </ng-template>
</p-table>

<ng-template #loading>
  <p>Loading...</p>
</ng-template>

<ng-template #loading>
  <p>Loading...</p>
</ng-template>

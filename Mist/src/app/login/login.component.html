<div class="mainDiv">
  <div class="container">
    <h2 class="LoginText">Login</h2>
    <form action="">
      <div class="form-group">
        <input
          type="nickname"
          class="form-control"
          id="nickname"
          placeholder="Enter nickname"
          name="nickname"
        />

        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter email"
          name="email"
        />

        <input
          type="password"
          class="form-control"
          id="pwd"
          placeholder="Enter password"
          name="pswd"
        />

        <button type="login" class="loginButton">Login</button>
      </div>
    </form>
  </div>
</div>
